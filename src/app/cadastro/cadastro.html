<div class="content-section cadastro-section">

    <div class="login-header">
        <div class="logo-placeholder">
            ✨
        </div>

        <h2>Criar conta</h2>
        <p>Preencha os dados abaixo para criar sua conta.</p>
    </div>

    <form>

        <div class="form-group">

            <input id="name" type="text" name="name" placeholder="Nome" required>
        </div>

        <div class="form-group">

            <input id="email" type="email" name="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">

            <input id="password" type="password" name="password" placeholder="Senha" required>
        </div>

        <div class="form-group">
            <input id="confirm-password" type="password" name="confirm-password" placeholder="Digite a senha novamente"
                required>
        </div>

        <button type="submit" class="aero-button">
            Criar conta
        </button>

    </form>

    <div class="form-footer">
        <span>Já possui uma conta?</span>
        <nav><a routerLink="/login">Entrar</a></nav>
    </div>
</div>
