<form class="form-busca" (ngSubmit)="pesquisar()">
  <label for="campo-busca"></label>

  <input
    id="campo-busca"
    name="termo"
    type="search"
    [(ngModel)]="termo"
    placeholder="Ex.: refrigerante, salgadinho..."
    class="form-control"
  >

  <button type="submit" class="aero-button">
    Pesquisar
  </button>
</form>
