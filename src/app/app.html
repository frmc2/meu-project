<div class="aero-desktop">
  <!--Janela Principal do site, que contém o menu superior, a barra de título, o cabeçalho do site, a área principal, o rodapé e a barra de status.-->
      
  <div class="aero-window">

    <!--Menu Superior-->

    <nav class="aero-menubar">
      <!--Botão para acessar a pagina de DetalheProduto-->
      <div class="menu-item">
        <a routerLink="/detalhe-produto" class="btn aero">Produtos</a>

        <div class="dropdown">
          <a routerLink="/resultado-busca">Bebidas</a>
          <a routerLink="/resultado-busca">Salgados</a>
          <a routerLink="/resultado-busca">Sobremesas</a>
          <a routerLink="/resultado-busca">Lanches</a>
          <a routerLink="/resultado-busca">Outros</a>
        </div>
      </div>
     <!--Botão para acessar a pagina de Cadastro-->
      <div class="menu-item">
        <a routerLink="/cadastro" class="btn aero">Cadastro</a>
      </div>
      <!--Botão para acessar a pagina de Cesta-->
      <div class="menu-item">
        <a routerLink="/cesta" class="btn aero">Cesta</a>
      </div>
      <!--Botão para acessar a pagina de login-->
      <div class="menu-item">
        <a routerLink="/login" class="btn aero">Login</a>
      </div>

      

      

    </nav>


    <!-- =======================================
         TITLE BAR
         ======================================= -->

    <header class="aero-titlebar">

      <div class="aero-title">

        <span>
          Frutinger Store
        </span>

      </div>


      <div class="aero-controls">

        <button
          type="button"
          aria-label="Minimize">
          −
        </button>

        <button
          type="button"
          aria-label="Maximize">
          □
        </button>

        <button
          type="button"
          class="close"
          aria-label="Close">
          ×
        </button>

      </div>

    </header>


    <!-- =======================================
         HEADER DO SITE
         ======================================= -->

    <header class="site-header">

      <div class="site-header-logo">

        <!-- Logo vira um botão que pode levar à página de Login -->
        <div class="logo-placeholder">
          <a routerLink="/">
            <img src="nav_logo.ico" style="width: 60px; height: 60px;">
          </a>
          
        </div>

        <div class="logo-text">

          <h1>
            Frutinger Store
          </h1>

          <span>
            Bem-vindo à Frutinger Store!
          </span>

        </div>

      </div>


      <div class="site-header-extra">


        
        <!--
          Aqui futuramente você pode colocar:

          - redes sociais
          - avatar
          - relógio
          - status
          - botão de login
          - etc.
        -->
        <!--Exemplo de avatar e caminho também para pagina de Login-->
        <div class="d-flex flex-column align-items-center">
        <a routerLink="/login"><img src="imgs/avatar_buddy.png" alt="Ícone de avatar" style="width: 50px; height: 50px; border-radius: 50%;"></a>
          <span>Login</span>
        </div>


      </div>

    </header>


    <!--Área Principal-->

    <main class="site-body">
       <div class="container">
          <router-outlet></router-outlet>
        </div>
    </main>


    <!-- =======================================
         FOOTER
         ======================================= -->

    <footer class="site-footer">

      <span>
        © 2026 Meu Site
      </span>

      <span>
        Frutinger Store
      </span>

    </footer>


    <!-- =======================================
         STATUS BAR
         ======================================= -->

    <div class="aero-statusbar">

      <span>
        🌐 Online
      </span>

      <span>
        Protected Mode
      </span>

    </div>

  </div>

</div>
