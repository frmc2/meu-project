<div class="aero-desktop">
  <!--Janela Principal do site, que contém o menu superior, a barra de título, o cabeçalho do site, a área principal, o rodapé e a barra de status.-->
  <div class="aero-window">

    <!--Menu Superior-->

    <nav class="menubar-shell" aria-label="Navegação principal" [class.menu-open]="menuProdutosAberto">
      <div class="aero-menubar">
        <!--Botão para acessar a pagina de DetalheProduto-->
        <div class="menu-item products-trigger">
          <button
            type="button"
            class="button-aero"
            aria-controls="menu-produtos-dropdown"
            [attr.aria-expanded]="menuProdutosAberto"
            (click)="alternarMenuProdutos()"
          >
            Produtos
          </button>
        </div>

        <!--Botão para acessar a pagina de Cadastro-->
        <div class="menu-item">
          <a routerLink="/cadastro" class="btn aero" (click)="fecharMenuProdutos()">Cadastro</a>
        </div>
        <!--Botão para acessar a pagina de Cesta-->
        <div class="menu-item">
          <a routerLink="/cesta" class="btn aero" (click)="fecharMenuProdutos()">Cesta</a>
        </div>
        <!--Botão para acessar a pagina de Vitrine-->
        <div class="menu-item">
          <a routerLink="" class="btn aero" (click)="fecharMenuProdutos()">Vitrine</a>
        </div>

        <!--Botão para acessar a pagina de login-->
        <div class="menu-item">
          <a routerLink="/login" class="btn aero" (click)="fecharMenuProdutos()">Login</a>
        </div>

        <div class="menu-item">
          <button class="btn aero" (click)="auth.logout()">Logout</button>
        </div>
      </div>

      <div class="dropdown" id="menu-produtos-dropdown">
        <a routerLink="/resultado-busca" [queryParams]="{ categoria: 'Bebidas' }" (click)="fecharMenuProdutos()">Bebidas</a>
        <a routerLink="/resultado-busca" [queryParams]="{ categoria: 'Salgados' }" (click)="fecharMenuProdutos()">Salgados</a>
        <a routerLink="/resultado-busca" [queryParams]="{ categoria: 'Doces' }" (click)="fecharMenuProdutos()">Doces</a>
        <a routerLink="/resultado-busca" [queryParams]="{ categoria: 'Lanches' }" (click)="fecharMenuProdutos()">Lanches</a>
        <a routerLink="/resultado-busca" [queryParams]="{ categoria: 'Outros' }" (click)="fecharMenuProdutos()">Outros</a>
      </div>
    </nav>


    <!-- =======================================
         TITLE BAR
         ======================================= -->

    <header class="aero-titlebar">

      <div class="aero-title">

        <span>
          Frutiger Store
        </span>

      </div>


      <div class="aero-controls">

        <button type="button" aria-label="Minimize">
          −
        </button>

        <button type="button" aria-label="Maximize">
          □
        </button>

        <button type="button" class="close" aria-label="Close">
          ×
        </button>

      </div>

    </header>


    <!-- =======================================
         HEADER DO SITE
         ======================================= -->

    <header class="site-header">

      <div class="site-header-logo">

        <!-- Logo vira um botão que pode levar à página de Login -->
        <div class="logo-placeholder">
          <a routerLink="/">
            <img src="nav_logo.ico">
          </a>
          
          
        </div>

        <div class="logo-text" style="margin-left: 10px;">
          <h1>
            Frutiger Store
          </h1>

          <span>
            Bem-vindo à Frutiger Store!
          </span>
        </div>
        
      </div>

      <div class="site-header-search" style="flex:1">
        <app-barra-busca></app-barra-busca>
      </div>
      <div class="site-header-extra">

        

        <!--
          Aqui futuramente você pode colocar:

          - redes sociais
          - avatar
          - relógio
          - status
          - botão de login
          - etc.""
        -->

        <!--Exemplo de avatar e caminho também para pagina de Login-->
        <div class="d-flex flex-column align-items-center">
          @if ( auth.verificarLogin() ) {
            <a routerLink="/perfil">
              <div class="logo-placeholder2" style="margin-top: 10px;">
                <img src="imgs/peixe-quadrado.png" alt="Ícone de avatar" style="width: 80px; height: 80px;">
              </div>
            </a>
          <p>Olá, {{ auth.getClient().nome }}!</p>
          } @else {
            <a routerLink="/perfil">
              <div class="logo-placeholder">
                <img src="imgs/avatar_buddy.png" alt="Ícone de avatar"
                  style="width: 70px; height: 70px; border-radius: 50%;">
              </div>
            </a>
          }
        </div>


      </div>

    </header>


    <!--Área Principal-->

    <main class="site-body">
      <div class="container">
        <router-outlet></router-outlet>
      </div>
    </main>


    <!-- =======================================
         FOOTER
         ======================================= -->




    <!-- =======================================
         STATUS BAR
         ======================================= -->

    <div class="aero-statusbar">

      <span>
        🌐 Online
      </span>

      <span>
        Protected Mode
      </span>

    </div>

  </div>

</div>
