<div class="content-section login-section">

    <div class="login-header">
        <div class="logo-placeholder2">
            🔑
        </div>

        <h2>Entrar</h2>
        <p>Entre na sua conta para continuar.</p>
    </div>

    <form>

        <div class="form-group">

            <input id="email" type="email" name="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">

            <input id="password" type="password" name="password" placeholder="Sua senha" required>
        </div>

        <div class="form-options">
            <label class="remember">
                <input type="checkbox">
                Lembrar de mim
            </label>

        </div>

        <nav>
            <a routerLink="/esqueci-senha">esqueci a senha</a>
        </nav>

        <button type="submit" class="aero-button">
            Entrar
        </button>

    </form>

    <div class="form-footer">
        <span>Não possui uma conta?</span>

        <a routerLink="/cadastro">
            Criar uma conta
        </a>
    </div>

</div>
