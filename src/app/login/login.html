<div class="content-section" style="align-self: center; justify-content: center; text-align: center;">

    <div class="login-header">
        <div class="logo-placeholder">
            <img src="imgs/peixe-redondo.png" height="100">
        </div>

        <h2>Login</h2>
    </div>


        <form (ngSubmit)="login()">

            <div class="form-group">

                <input id="email" type="email" name="email" placeholder="seu@email.com" [(ngModel)]="email" required>
            </div>

            <div class="form-group">

                <input id="password" type="password" name="senha" placeholder="Sua senha" [(ngModel)]="senha" required>
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox">
                    Lembrar de mim
                </label>

            </div>

            <nav>
                <a routerLink="/esqueci-senha">esqueci a senha</a>
            </nav>

            <button type="submit" class="aero-button">
                Entrar
            </button>

            @if (erro) {
            <p role="alert">{{ erro }}</p>
            }
        </form>
        @if (statusRedirecionamento) {
        <p role="status">{{ statusRedirecionamento }}</p>
        }

    <div class="form-footer">
        <span>Não possui uma conta?</span>

        <a routerLink="/cadastro">
            Criar uma conta
        </a>
    </div>

</div>
