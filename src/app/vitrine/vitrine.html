<h2>Bem-vindo!</h2>

<p>Escolha um produto abaixo ou use a barra de busca para encontrar algo específico.</p>

<section class="content-section">
  <h3>Barra de Busca</h3>

  <p>
    Pesquise um produto da Frutiger Store
  </p>
  <!--Chamando o metodo Barra de Busca de barra-busca-->
  <app-barra-busca></app-barra-busca>
</section>

<section class="content-section">
  <h3>Produtos em destaque</h3>

  <div class="produtos-grid">

    @for (produto of produtos; track produto.id) {
    <article class="produto-card">

      <div class="produto-imagem">
        <img [src]="produto.imagem" [alt]="produto.nome" height="110">
      </div>

      <h4>{{ produto.nome }}</h4>

      <strong>
        R$ {{ produto.preco.toFixed(2) }}
      </strong>

      <button [routerLink]="['/detalhe-produto', produto.id]" class="aero-button">DETALHES</button>
    </article>
    }
  </div>
</section>
